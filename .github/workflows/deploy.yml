name: Build and Deploy (Docker Compose)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]   # 두 이미지를 각각 빌드

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push ${{ matrix.service }} image
      uses: docker/build-push-action@v6
      with:
        context: ./${{ matrix.service }}
        push: true
        platforms: linux/amd64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/guestbook-${{ matrix.service }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    # 소스(compose 파일 포함)를 서버로 복사
    - name: Copy source to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "docker-compose.yml,frontend,backend"
        target: "/home/${{ secrets.SERVER_USERNAME }}/guestbook"

    - name: Deploy with docker compose
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script_stop: true
        script: |
          cd ~/guestbook

          echo "🔐 .env 확인 (서버에 미리 만들어 둔 DB 비밀번호 파일)"
          test -f .env || { echo ".env 파일이 없습니다. 서버에 먼저 만들어 주세요."; exit 1; }

          echo "🧹 이전 단일 컨테이너(guestbook)가 80번 포트를 쓰고 있으면 정리"
          docker rm -f guestbook 2>/dev/null || true

          echo "🚀 최신 이미지 가져오기"
          docker compose pull

          echo "🏃 변경된 서비스만 재생성 (DB는 그대로 유지)"
          docker compose up -d --remove-orphans

          docker compose ps

          echo "🧼 안 쓰는 이미지 정리"
          docker image prune -f

          echo "🎉 배포 완료"
