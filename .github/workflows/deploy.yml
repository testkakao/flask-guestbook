name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # main 브랜치에 코드가 푸시되면 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest # 인텔 기반 가상 서버 대여

    steps:
    # 1. 소스 코드 가져오기
    - name: Check out repository code
      uses: actions/checkout@v4

    # 2. 도커 허브 로그인 (깃허브 Secret 변수 활용)
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # (추가) 인텔 러너에서 arm64 이미지도 빌드하기 위한 에뮬레이터/빌더
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. 이미지 빌드 및 푸시 (인텔 amd64 + ARM 가상머신용 arm64 동시 빌드)
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # 빌드가 반드시 성공해야만 배포를 시작합니다.

    steps:
    # SSH 원격 접속 후 서버 컴퓨터 터미널에서 아래 명령어들을 차례로 실행합니다.
    - name: Executing remote ssh commands using ssh key
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          echo "🚀 1. 도커 허브에서 최신 이미지 가져오기..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

          echo "🧹 2. 기존 실행 중인 컨테이너 안전하게 정리하기..."
          docker stop guestbook || true
          docker rm guestbook || true

          echo "🏃 3. 새 이미지로 컨테이너 실행하기..."
          docker run -d -p 80:5000 --name guestbook ${{ secrets.DOCKERHUB_USERNAME }}/flask-guestbook:latest

          echo "🧼 4. 안 쓰는 옛날 이미지(찌꺼기) 청소하기..."
          docker image prune -f

          echo "🎉 배포가 성공적으로 완료되었습니다!"
